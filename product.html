<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details | TN TECHNOLOGY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f7f7f9;color:#111}header{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}.nav{max-width:1280px;margin:auto;height:82px;padding:0 38px;display:flex;align-items:center;justify-content:space-between;gap:24px}.logo{font-size:27px;font-weight:900;letter-spacing:-1px;color:#252525}.logo span{font-size:11px;letter-spacing:0;color:#777;display:block;font-weight:600;margin-top:-4px}nav{display:flex;gap:30px}nav a{color:#111;text-decoration:none;font-size:15px;font-weight:600}.back{color:#111;text-decoration:none;border:1px solid #111;padding:10px 14px;font-size:14px;font-weight:700}.page{max-width:1280px;margin:0 auto;padding:30px 40px 65px}.crumb{font-size:14px;color:#777;margin-bottom:27px}.crumb span{color:#111}.product{display:grid;grid-template-columns:minmax(500px,1.15fr) minmax(340px,.85fr);gap:48px;align-items:start}.gallery{display:grid;grid-template-columns:74px 1fr;gap:24px}.thumbs{display:flex;flex-direction:column;gap:14px}.thumb{width:64px;height:64px;border:2px solid #111;border-radius:9px;background:white;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}.thumb img{width:100%;height:100%;object-fit:contain;padding:5px}.main-photo{background:#fff;border-radius:20px;min-height:510px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.main-photo img{width:100%;height:510px;object-fit:contain;padding:32px}.main-photo .emoji{font-size:170px}.zoom{position:absolute;right:16px;bottom:16px;border:1px solid #d1d5db;background:white;width:40px;height:40px;font-size:20px;cursor:pointer}.details{padding-top:4px}.details h1{font-size:clamp(31px,4vw,47px);line-height:1.12;letter-spacing:-1.4px;margin-bottom:24px}.price-row{display:flex;align-items:center;gap:13px;flex-wrap:wrap}.price{font-size:27px;color:#ef2929;font-weight:700}.old-price{font-size:16px;color:#777;text-decoration:line-through}.discount{font-size:12px;color:white;background:#ef3c3c;padding:6px 8px;font-weight:800;border-radius:4px}.tax{font-size:14px;margin-top:10px;color:#333}.line{border:0;border-top:1px solid #d8d8d8;margin:31px 0}.bulk{font-size:16px;font-weight:600}.options{margin-top:38px}.option{font-size:16px;margin-top:25px}.choice{border:2px solid #111;padding:14px 18px;display:inline-block;min-width:78px;text-align:center;font-weight:600;margin-top:12px}.color-dot{height:41px;width:41px;border-radius:50%;display:block;border:3px solid #fff;outline:2px solid #111;margin:13px 0}.quantity{display:flex;width:160px;border:1px solid #d5d5d5;margin-top:12px}.quantity button{width:48px;border:0;background:#f4f4f4;font-size:22px;cursor:pointer}.quantity span{flex:1;text-align:center;padding:13px 0}.cart{width:100%;border:0;background:#111;color:#fff;padding:16px;margin-top:31px;font-size:15px;font-weight:800;letter-spacing:.3px;cursor:pointer}.order{display:block;width:100%;text-align:center;text-decoration:none;border:1px solid #111;color:#111;padding:15px;margin-top:12px;font-size:15px;font-weight:800}.cart-message{height:18px;text-align:center;color:#15803d;font-weight:700;font-size:14px;margin-top:8px}.more{max-width:930px;margin:75px auto 0;padding-top:50px;border-top:1px solid #ddd}.more h2{font-size:clamp(35px,5vw,58px);letter-spacing:-2px;margin-bottom:22px}.more p{white-space:pre-line;font-size:18px;line-height:1.75;color:#222}@media(max-width:850px){.nav{height:68px;padding:0 18px}.logo{font-size:21px}nav{display:none}.page{padding:22px 16px 45px}.product{grid-template-columns:1fr;gap:28px}.gallery{grid-template-columns:1fr}.thumbs{flex-direction:row;order:2}.main-photo{min-height:360px}.main-photo img{height:360px}.details h1{font-size:34px}.more{margin-top:45px;padding-top:35px}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">TN TECHNOLOGY<span>Mobile Accessories</span></div><nav><a href="index.html">Home</a><a href="index.html#products">Products</a><a href="index.html#contact">Contact</a></nav><a class="back" href="index.html">← Products</a></div></header>
<main class="page">
<p class="crumb">Home / Products / <span id="crumb"></span></p>
<section class="product">
<div class="gallery"><div class="thumbs"><button class="thumb" id="thumb" type="button" aria-label="Product image"></button></div><div class="main-photo" id="photo"><button class="zoom" id="zoom" type="button" title="ছবি বড় করুন">⌕</button></div></div>
<div class="details"><h1 id="name"></h1><div class="price-row"><span class="price" id="price"></span><span class="old-price" id="oldPrice"></span><span class="discount" id="discount"></span></div><p class="tax">দাম ও delivery charge জানতে WhatsApp-এ যোগাযোগ করুন।</p><hr class="line"><p class="bulk">বাল্ক অর্ডার বা দোকানের জন্য পণ্য নিতে WhatsApp-এ মেসেজ করুন।</p><div class="options"><div class="option">Size: <strong id="size"></strong><span class="choice" id="sizeBox"></span></div><div class="option">Color: <strong id="color"></strong><span class="color-dot" id="colorDot"></span></div><div class="option">Quantity:<div class="quantity"><button id="minus" type="button">−</button><span id="quantity">1</span><button id="plus" type="button">+</button></div></div></div><button class="cart" id="cart" type="button">কার্টে যোগ করুন</button><p class="cart-message" id="cartMessage"></p><a class="order" id="order" target="_blank">WhatsApp-এ অর্ডার করুন</a></div>
</section>
<section class="more"><h2>Product Details</h2><p id="moreDetails"></p></section>
</main>
<script>
const data=new URLSearchParams(location.search);
const name=data.get("name")||"Product",price=data.get("price")||"",oldPrice=data.get("oldPrice")||"",discount=data.get("discount")||"",size=data.get("size")||"Standard",color=data.get("color")||"Black",image=data.get("image"),icon=data.get("icon")||"📦",details=data.get("details")||"";
document.title=name+" | TN TECHNOLOGY";
document.getElementById("crumb").textContent=name;document.getElementById("name").textContent=name;document.getElementById("price").textContent=price;document.getElementById("oldPrice").textContent=oldPrice;document.getElementById("discount").textContent=discount;document.getElementById("size").textContent=size;document.getElementById("sizeBox").textContent=size;document.getElementById("color").textContent=color;document.getElementById("colorDot").style.background=color.toLowerCase()==="white"?"#fff":color.toLowerCase()==="clear"?"#dbeafe":"#111";document.getElementById("moreDetails").textContent=details;
const picture=image?'<img src="'+image+'" alt="'+name+'">':'<span class="emoji">'+icon+'</span>';
document.getElementById("photo").insertAdjacentHTML("afterbegin",picture);document.getElementById("thumb").innerHTML=image?'<img src="'+image+'" alt="'+name+'">':icon;
document.getElementById("zoom").onclick=()=>{const e=document.querySelector(".main-photo img");if(e){e.style.transform=e.style.transform?"":"scale(1.35)";e.style.transition="transform .25s";}};
let quantity=1;const quantityText=document.getElementById("quantity");document.getElementById("minus").onclick=()=>{if(quantity>1){quantity--;quantityText.textContent=quantity;}};document.getElementById("plus").onclick=()=>{quantity++;quantityText.textContent=quantity;};
document.getElementById("cart").onclick=()=>{const cart=JSON.parse(localStorage.getItem("tnCart")||"[]");cart.push({name,price,quantity});localStorage.setItem("tnCart",JSON.stringify(cart));document.getElementById("cartMessage").textContent="পণ্যটি কার্টে যোগ করা হয়েছে।";};
document.getElementById("order").onclick=()=>{const message=encodeURIComponent("আসসালামু আলাইকুম, আমি "+name+" নিতে চাই। দাম: "+price+"। পরিমাণ: "+quantity);document.getElementById("order").href="https://wa.me/8801606191562?text="+message;};
</script>
</body>
</html>
