<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details | TN TECHNOLOGY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f6f7fb;color:#171923}header{background:#111827;color:#fff}.nav{max-width:1100px;margin:auto;padding:15px 20px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:800}.logo span{font-size:12px;color:#a5b4fc;display:block;font-weight:500}.back{color:#fff;text-decoration:none;font-weight:700}.page{max-width:1100px;margin:0 auto;padding:28px 20px}.crumb{color:#6b7280;margin-bottom:20px;font-size:14px}.product{background:#fff;border-radius:20px;padding:28px;display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,1fr);gap:42px;box-shadow:0 5px 20px #1111}.photo{background:#eef0ff;border-radius:16px;min-height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:140px}.photo img{width:100%;height:420px;object-fit:contain;padding:20px}.details{padding:16px 0}.details h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin-bottom:18px}.price{font-size:28px;font-weight:800;color:#4f46e5;margin-bottom:22px}.line{border:0;border-top:1px solid #e5e7eb;margin:22px 0}.description{font-size:17px;line-height:1.7;color:#374151}.order{display:block;text-align:center;background:#111827;color:#fff;text-decoration:none;padding:14px 20px;border-radius:10px;font-weight:700;margin-top:28px;font-size:17px}.more{background:#fff;border-radius:20px;padding:38px;margin-top:28px;box-shadow:0 5px 20px #1111}.more h2{font-size:clamp(28px,5vw,46px);margin-bottom:18px}.more p{white-space:pre-line;font-size:17px;line-height:1.8;color:#374151;max-width:850px}@media(max-width:700px){.product{grid-template-columns:1fr;padding:20px;gap:15px}.photo{min-height:290px}.photo img{height:290px}.details{padding:0}.more{padding:25px}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">TN TECHNOLOGY<span>Mobile Accessories</span></div><a class="back" href="index.html">← Products</a></div></header>
<main class="page"><p class="crumb">Home / Products / <span id="crumb"></span></p><section class="product"><div class="photo" id="photo"></div><div class="details"><h1 id="name"></h1><div class="price" id="price"></div><hr class="line"><p class="description" id="description"></p><a class="order" id="order" target="_blank">WhatsApp-এ অর্ডার করুন</a></div></section><section class="more"><h2>Product Details</h2><p id="moreDetails"></p></section></main>
<script>
const data=new URLSearchParams(location.search);
const name=data.get("name")||"Product";
const price=data.get("price")||"";
const image=data.get("image");
const icon=data.get("icon")||"📦";
const description=data.get("description")||"এই product সম্পর্কে বিস্তারিত জানতে WhatsApp-এ মেসেজ করুন।";
const details=data.get("details")||"";
document.title=`${name} | TN TECHNOLOGY`;
document.getElementById("crumb").textContent=name;
document.getElementById("name").textContent=name;
document.getElementById("price").textContent=price;
document.getElementById("description").textContent=description;
document.getElementById("moreDetails").textContent=details;
document.getElementById("photo").innerHTML=image?`<img src="${image}" alt="${name}">`:icon;
const message=encodeURIComponent(`আসসালামু আলাইকুম, আমি ${name} নিতে চাই। দাম: ${price}`);
document.getElementById("order").href=`https://wa.me/8801606191562?text=${message}`;
</script>
</body>
</html>
